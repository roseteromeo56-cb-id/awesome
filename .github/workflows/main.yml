name: Awesome lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'
      - '.github/workflows/main.yml'
      - '.github/workflows/repo_linter.sh'
      - 'tests/repo_linter_test.sh'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: security regression scan
        shell: bash
        run: |
          set -euo pipefail

          found=0

          while IFS= read -r -d '' workflow; do
            if ! grep -Eq '^[[:space:]]*pull_request:' "$workflow"; then
              continue
            fi

            while IFS=: read -r line_number line; do
              echo "::error file=$workflow,line=$line_number::pull_request workflow must not run repo-local shell scripts from checked-out PR content"
              echo "$line"
              found=1
            done < <(grep -nE '(^|[[:space:]])(\./|[A-Za-z0-9_.-]+/)[^[:space:]]+\.sh([[:space:]]|$)' "$workflow" || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "No critical pull_request workflow local-script execution findings."
      - name: awesome-lint
        shell: bash
        run: |
          set -euo pipefail

          normalize_repo_url() {
            local candidate=$1
            local github_repo_url='^https://github\.com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]+#readme$'

            if [[ ! $candidate =~ $github_repo_url ]]; then
              return 1
            fi

            printf '%s\n' "${candidate%#readme}"
          }

          extract_repo_to_lint() {
            local line
            local candidate

            while IFS= read -r line; do
              [[ $line == +* ]] || continue
              [[ $line != +++* ]] || continue

              while IFS= read -r candidate; do
                normalize_repo_url "$candidate" && return 0
              done < <(printf '%s\n' "${line#+}" | grep -Eo 'https://[^[:space:])>]+' || true)
            done
          }

          repo_to_lint=$(git diff origin/main -- readme.md | extract_repo_to_lint || true)

          if [ -z "$repo_to_lint" ]; then
            echo "No new GitHub link found in the format: https://github.com/owner/repo#readme"
            exit 0
          fi

          clone_dir=$(mktemp -d)
          trap 'rm -rf "$clone_dir"' EXIT

          echo "Cloning $repo_to_lint"
          git clone --depth 1 --single-branch -- "$repo_to_lint" "$clone_dir"
          npm exec --yes --package=awesome-lint -- awesome-lint "$clone_dir/readme.md"
