name: Awesome lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: security regression scan
        shell: bash
        run: |
          set -euo pipefail

          found=0

          while IFS= read -r -d '' workflow; do
            if ! grep -Eq '^[[:space:]]*pull_request:' "$workflow"; then
              continue
            fi

            while IFS=: read -r line_number line; do
              echo "::error file=$workflow,line=$line_number::pull_request workflow must not run repo-local shell scripts from checked-out PR content"
              echo "$line"
              found=1
            done < <(grep -nE '(^|[[:space:]])(\./|[A-Za-z0-9_.-]+/)[^[:space:]]+\.sh([[:space:]]|$)' "$workflow" || true)
          done < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          if [ "$found" -ne 0 ]; then
            exit 1
          fi

          echo "No critical pull_request workflow local-script execution findings."
      - name: awesome-lint
        shell: bash
        run: |
          set -euo pipefail

          repo_to_lint=$(
            {
              git diff origin/main -- readme.md |
                grep '^+' |
                grep -Eo 'https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#readme' |
                sed 's/#readme//' |
                head -n 1
            } || true
          )

          if [ -z "$repo_to_lint" ]; then
            echo "No new link found in the format: https://github.com/user/repo#readme"
            exit 0
          fi

          echo "Cloning $repo_to_lint"
          git clone --depth 1 "$repo_to_lint" cloned
          cd cloned
          npx awesome-lint
